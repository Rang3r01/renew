<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Header Explorations — Renew</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #1a1a2e; }
    button, input { font-family: 'DM Sans', sans-serif; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const T = '#2BB5C8';
const TD = '#1A8A9A';
const DARK = '#0d2b35';
const CATS = ['Oxygen Products','Supplements','Recovery','Wellness'];

/* ─── Logo mark ─── */
const Logo = ({ size = 32 }) => (
  <div style={{
    width: size, height: size, borderRadius: '50%',
    background: 'linear-gradient(135deg, #2BB5C8, #1A8A9A)',
    flexShrink: 0,
  }} />
);

/* ══════════════════════════════════════════════
   OPTION A — Announcement bar + two-row nav
══════════════════════════════════════════════ */
const HeaderA = () => {
  const [active, setActive] = React.useState('Supplements');
  return (
    <div style={{ fontFamily: "'DM Sans',sans-serif", width: '100%' }}>
      {/* Announcement banner */}
      <div style={{ background: T, color: '#fff', textAlign: 'center', padding: '8px 16px', fontSize: 13, fontWeight: 600, letterSpacing: '0.02em' }}>
        🚚 Free shipping on orders over R1,000 &nbsp;·&nbsp; By appointment only — <span style={{ textDecoration: 'underline', cursor: 'pointer' }}>Book now</span>
      </div>
      {/* Main nav row */}
      <div style={{ background: DARK, padding: '0 32px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', height: 60 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <Logo />
          <div>
            <div style={{ fontSize: 20, fontWeight: 800, color: T, letterSpacing: '-0.01em', lineHeight: 1 }}>RENEW</div>
            <div style={{ fontSize: 10, color: 'rgba(255,255,255,0.4)', letterSpacing: '0.05em' }}>HEALTH SUPPLIES</div>
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <div style={{ position: 'relative' }}>
            <span style={{ position: 'absolute', left: 10, top: '50%', transform: 'translateY(-50%)', color: 'rgba(255,255,255,0.3)', fontSize: 15 }}>⌕</span>
            <input style={{ background: 'rgba(255,255,255,0.07)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 8, padding: '7px 12px 7px 32px', fontSize: 13, color: '#fff', outline: 'none', width: 200 }} placeholder="Search products…" />
          </div>
          <button style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,0.5)', fontSize: 13, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6 }}>
            <span style={{ fontSize: 16 }}>👤</span> Account
          </button>
          <button style={{ background: T, color: '#fff', border: 'none', borderRadius: 8, padding: '8px 16px', fontSize: 13, fontWeight: 700, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8 }}>
            Cart <span style={{ background: '#fff', color: TD, borderRadius: '50%', width: 18, height: 18, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 800 }}>3</span>
          </button>
        </div>
      </div>
      {/* Category row */}
      <div style={{ background: '#0a2230', padding: '0 32px', display: 'flex', alignItems: 'center', gap: 4, borderBottom: '1px solid rgba(255,255,255,0.06)', height: 44 }}>
        {CATS.map(c => (
          <button key={c} onClick={() => setActive(c)} style={{
            background: 'none', border: 'none', cursor: 'pointer', padding: '0 14px', height: '100%',
            fontSize: 13, fontWeight: active === c ? 700 : 500,
            color: active === c ? T : 'rgba(255,255,255,0.45)',
            borderBottom: active === c ? `2px solid ${T}` : '2px solid transparent',
            transition: 'all 0.15s',
          }}>{c}</button>
        ))}
        <div style={{ marginLeft: 'auto', fontSize: 12, color: 'rgba(255,255,255,0.25)', letterSpacing: '0.04em' }}>12 products</div>
      </div>
    </div>
  );
};

/* ══════════════════════════════════════════════
   OPTION B — Mega-menu dropdown
══════════════════════════════════════════════ */
const HeaderB = () => {
  const [open, setOpen] = React.useState(null);
  const megaItems = {
    'Oxygen Products': [
      { name: 'Concentrators', sub: '3 products' },
      { name: 'CPAP Machines', sub: '2 products' },
      { name: 'Nebulizers', sub: '4 products' },
      { name: 'Pulse Oximeters', sub: '2 products' },
    ],
    'Supplements': [
      { name: 'Protein', sub: '4 products' },
      { name: 'Vitamins & Minerals', sub: '6 products' },
      { name: 'Immune Support', sub: '3 products' },
      { name: 'Collagen', sub: '2 products' },
    ],
    'Recovery': [{ name: 'Foam Rollers', sub: '2 products' }, { name: 'Compression', sub: '1 product' }],
    'Wellness': [{ name: 'Skin Health', sub: '2 products' }, { name: 'Sleep Support', sub: '2 products' }],
  };
  return (
    <div style={{ fontFamily: "'DM Sans',sans-serif", width: '100%', position: 'relative' }} onMouseLeave={() => setOpen(null)}>
      <div style={{ background: DARK, padding: '0 32px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', height: 64 }}>
        {/* Logo */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <Logo />
          <div>
            <span style={{ fontSize: 20, fontWeight: 800, color: T }}>RENEW</span>
            <span style={{ fontSize: 13, color: 'rgba(255,255,255,0.4)', marginLeft: 6 }}>Health Supplies</span>
          </div>
        </div>
        {/* Nav items */}
        <div style={{ display: 'flex', alignItems: 'center', height: '100%', gap: 2 }}>
          {CATS.map(c => (
            <div key={c} style={{ height: '100%', display: 'flex', alignItems: 'center', position: 'relative' }}
              onMouseEnter={() => setOpen(c)}>
              <button style={{
                background: 'none', border: 'none', cursor: 'pointer', padding: '0 14px', height: '100%',
                fontSize: 14, fontWeight: open === c ? 700 : 500,
                color: open === c ? T : 'rgba(255,255,255,0.6)',
                borderBottom: open === c ? `2px solid ${T}` : '2px solid transparent',
                display: 'flex', alignItems: 'center', gap: 5, transition: 'all 0.15s',
              }}>
                {c} <span style={{ fontSize: 10, opacity: 0.5 }}>▾</span>
              </button>
            </div>
          ))}
        </div>
        {/* Right */}
        <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
          <button style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,0.45)', fontSize: 20, cursor: 'pointer' }}>⌕</button>
          <button style={{ background: T, color: '#fff', border: 'none', borderRadius: 8, padding: '8px 18px', fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>
            Cart · 3
          </button>
        </div>
      </div>
      {/* Mega dropdown */}
      {open && megaItems[open] && (
        <div style={{
          position: 'absolute', top: 64, left: 0, right: 0, zIndex: 200,
          background: '#0f3340', borderTop: `2px solid ${T}`,
          boxShadow: '0 16px 48px rgba(0,0,0,0.4)',
          padding: '28px 40px', display: 'flex', gap: 32,
        }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: 'rgba(255,255,255,0.3)', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 16 }}>{open}</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2,1fr)', gap: 8 }}>
              {megaItems[open].map(i => (
                <div key={i.name} style={{ padding: '10px 14px', borderRadius: 8, cursor: 'pointer', transition: 'background 0.15s' }}
                  onMouseEnter={e => e.currentTarget.style.background = 'rgba(43,181,200,0.1)'}
                  onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                  <div style={{ fontSize: 14, fontWeight: 600, color: '#fff' }}>{i.name}</div>
                  <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.35)', marginTop: 2 }}>{i.sub}</div>
                </div>
              ))}
            </div>
          </div>
          <div style={{ width: 180, background: `linear-gradient(135deg, ${T}22, ${TD}22)`, borderRadius: 10, padding: '20px', border: `1px solid ${T}33` }}>
            <div style={{ fontSize: 12, color: T, fontWeight: 700, marginBottom: 8 }}>NEW ARRIVAL</div>
            <div style={{ fontSize: 15, color: '#fff', fontWeight: 700, lineHeight: 1.3, marginBottom: 12 }}>Oxygen Concentrator 5L Pro</div>
            <div style={{ fontSize: 20, fontWeight: 800, color: T }}>R4,999</div>
          </div>
        </div>
      )}
    </div>
  );
};

/* ══════════════════════════════════════════════
   OPTION C — Floating pill nav
══════════════════════════════════════════════ */
const HeaderC = () => {
  const [active, setActive] = React.useState('Supplements');
  return (
    <div style={{ fontFamily: "'DM Sans',sans-serif", width: '100%', background: 'linear-gradient(135deg, #0d2b35, #0f3d4a)', padding: '20px 32px 0' }}>
      {/* Floating nav pill */}
      <div style={{
        background: 'rgba(13,43,53,0.85)', backdropFilter: 'blur(16px)',
        border: '1px solid rgba(43,181,200,0.2)', borderRadius: 16,
        padding: '0 20px', display: 'flex', alignItems: 'center',
        justifyContent: 'space-between', height: 56,
        boxShadow: '0 4px 32px rgba(0,0,0,0.3)',
      }}>
        {/* Logo */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <Logo size={28} />
          <span style={{ fontSize: 18, fontWeight: 800, color: T }}>RENEW</span>
        </div>
        {/* Category pills */}
        <div style={{ display: 'flex', gap: 4 }}>
          {CATS.map(c => (
            <button key={c} onClick={() => setActive(c)} style={{
              background: active === c ? T : 'transparent',
              border: active === c ? 'none' : '1px solid rgba(255,255,255,0.1)',
              borderRadius: 20, padding: '6px 14px', fontSize: 12,
              fontWeight: 600, color: active === c ? '#fff' : 'rgba(255,255,255,0.5)',
              cursor: 'pointer', transition: 'all 0.2s',
            }}>{c}</button>
          ))}
        </div>
        {/* Right actions */}
        <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
          <button style={{ background: 'rgba(255,255,255,0.07)', border: 'none', borderRadius: 8, width: 36, height: 36, color: 'rgba(255,255,255,0.5)', fontSize: 16, cursor: 'pointer' }}>⌕</button>
          <button style={{ background: 'rgba(255,255,255,0.07)', border: 'none', borderRadius: 8, width: 36, height: 36, color: 'rgba(255,255,255,0.5)', fontSize: 16, cursor: 'pointer' }}>👤</button>
          <button style={{ background: `linear-gradient(135deg,${T},${TD})`, color: '#fff', border: 'none', borderRadius: 8, padding: '8px 14px', fontSize: 13, fontWeight: 700, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6 }}>
            🛒 <span style={{ background: 'rgba(255,255,255,0.25)', borderRadius: 10, padding: '1px 6px', fontSize: 11, fontWeight: 800 }}>3</span>
          </button>
        </div>
      </div>
      {/* Hero peek */}
      <div style={{ height: 80, display: 'flex', alignItems: 'center', paddingLeft: 8 }}>
        <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.2)', letterSpacing: '0.08em' }}>SHOWING · {active.toUpperCase()}</div>
      </div>
    </div>
  );
};

/* ══════════════════════════════════════════════
   OPTION D — Centered logo + full search bar
══════════════════════════════════════════════ */
const HeaderD = () => {
  const [focused, setFocused] = React.useState(false);
  const [active, setActive] = React.useState('All');
  return (
    <div style={{ fontFamily: "'DM Sans',sans-serif", width: '100%' }}>
      {/* Top row */}
      <div style={{ background: DARK, padding: '12px 32px', display: 'flex', alignItems: 'center', gap: 24 }}>
        {/* Logo */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
          <Logo />
          <div>
            <div style={{ fontSize: 19, fontWeight: 800, color: T, lineHeight: 1 }}>RENEW</div>
            <div style={{ fontSize: 9, color: 'rgba(255,255,255,0.3)', letterSpacing: '0.06em' }}>HEALTH SUPPLIES SECUNDA</div>
          </div>
        </div>
        {/* Search */}
        <div style={{ flex: 1, position: 'relative' }}>
          <span style={{ position: 'absolute', left: 16, top: '50%', transform: 'translateY(-50%)', color: focused ? T : 'rgba(255,255,255,0.25)', fontSize: 16, transition: 'color 0.2s' }}>⌕</span>
          <input
            onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}
            style={{
              width: '100%', background: focused ? 'rgba(43,181,200,0.08)' : 'rgba(255,255,255,0.05)',
              border: `1.5px solid ${focused ? T : 'rgba(255,255,255,0.08)'}`,
              borderRadius: 10, padding: '10px 16px 10px 44px',
              fontSize: 14, color: '#fff', outline: 'none', transition: 'all 0.2s',
            }}
            placeholder="Search products, brands…"
          />
          {focused && (
            <div style={{ position: 'absolute', top: 'calc(100% + 6px)', left: 0, right: 0, background: '#0f3340', border: `1px solid ${T}33`, borderRadius: 10, padding: '12px', boxShadow: '0 12px 40px rgba(0,0,0,0.4)', zIndex: 100 }}>
              <div style={{ fontSize: 10, fontWeight: 700, color: 'rgba(255,255,255,0.3)', letterSpacing: '0.08em', marginBottom: 10 }}>POPULAR SEARCHES</div>
              {['Oxygen concentrator', 'Vitamin D', 'CPAP machine', 'Protein powder'].map(s => (
                <div key={s} style={{ padding: '7px 10px', borderRadius: 6, cursor: 'pointer', fontSize: 13, color: 'rgba(255,255,255,0.6)', display: 'flex', alignItems: 'center', gap: 10 }}
                  onMouseEnter={e => { e.currentTarget.style.background = 'rgba(43,181,200,0.1)'; e.currentTarget.style.color = '#fff'; }}
                  onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = 'rgba(255,255,255,0.6)'; }}>
                  <span style={{ color: 'rgba(255,255,255,0.2)' }}>⌕</span> {s}
                </div>
              ))}
            </div>
          )}
        </div>
        {/* Right */}
        <div style={{ display: 'flex', gap: 12, alignItems: 'center', flexShrink: 0 }}>
          <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.3)' }}>Welcome back</div>
            <div style={{ fontSize: 13, fontWeight: 700, color: '#fff' }}>Jane Smith</div>
          </div>
          <button style={{ background: T, color: '#fff', border: 'none', borderRadius: 8, padding: '9px 18px', fontSize: 13, fontWeight: 700, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8 }}>
            Cart <span style={{ background: 'rgba(255,255,255,0.25)', borderRadius: 10, padding: '1px 7px', fontSize: 11, fontWeight: 800 }}>3</span>
          </button>
        </div>
      </div>
      {/* Category tab bar */}
      <div style={{ background: '#0a2230', padding: '0 32px', display: 'flex', gap: 0, borderBottom: '1px solid rgba(255,255,255,0.05)', height: 42 }}>
        {['All', ...CATS].map(c => (
          <button key={c} onClick={() => setActive(c)} style={{
            background: 'none', border: 'none', padding: '0 16px', height: '100%',
            fontSize: 13, fontWeight: active === c ? 700 : 400,
            color: active === c ? T : 'rgba(255,255,255,0.4)',
            borderBottom: active === c ? `2px solid ${T}` : '2px solid transparent',
            cursor: 'pointer', transition: 'all 0.15s', whiteSpace: 'nowrap',
          }}>{c}</button>
        ))}
      </div>
    </div>
  );
};

/* ══════════════════════════════════════════════
   OPTION E — Scroll-aware transparent header
══════════════════════════════════════════════ */
const HeaderE = () => {
  const [scrolled, setScrolled] = React.useState(false);
  const containerRef = React.useRef(null);

  const handleScroll = () => {
    if (containerRef.current) setScrolled(containerRef.current.scrollTop > 40);
  };

  return (
    <div ref={containerRef} onScroll={handleScroll} style={{ fontFamily: "'DM Sans',sans-serif", width: '100%', height: 240, overflowY: 'auto', position: 'relative', background: 'linear-gradient(135deg, #0d2b35 0%, #1A5060 100%)' }}>
      {/* Sticky transparent-to-solid nav */}
      <div style={{
        position: 'sticky', top: 0, zIndex: 10, transition: 'all 0.3s',
        background: scrolled ? 'rgba(13,43,53,0.97)' : 'transparent',
        backdropFilter: scrolled ? 'blur(16px)' : 'none',
        borderBottom: scrolled ? '1px solid rgba(43,181,200,0.15)' : '1px solid transparent',
        boxShadow: scrolled ? '0 4px 24px rgba(0,0,0,0.3)' : 'none',
        padding: '0 32px', display: 'flex', alignItems: 'center',
        justifyContent: 'space-between', height: 64,
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <Logo />
          <div>
            <span style={{ fontSize: 20, fontWeight: 800, color: scrolled ? T : '#fff', transition: 'color 0.3s' }}>RENEW</span>
            <span style={{ fontSize: 12, color: 'rgba(255,255,255,0.4)', marginLeft: 6 }}>Health Supplies</span>
          </div>
        </div>
        <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
          {['All Products', 'Oxygen', 'Supplements', 'Wellness'].map(n => (
            <button key={n} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,0.6)', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>{n}</button>
          ))}
        </div>
        <button style={{ background: scrolled ? T : 'rgba(255,255,255,0.15)', border: scrolled ? 'none' : '1px solid rgba(255,255,255,0.3)', color: '#fff', borderRadius: 8, padding: '8px 16px', fontSize: 13, fontWeight: 700, cursor: 'pointer', transition: 'all 0.3s', display: 'flex', alignItems: 'center', gap: 8 }}>
          Cart <span style={{ background: 'rgba(255,255,255,0.25)', borderRadius: 10, padding: '1px 7px', fontSize: 11, fontWeight: 800 }}>3</span>
        </button>
      </div>
      {/* Content to scroll */}
      <div style={{ padding: '24px 32px', color: 'rgba(255,255,255,0.35)', fontSize: 13 }}>
        <div style={{ marginBottom: 8, fontSize: 11, letterSpacing: '0.08em' }}>↕ SCROLL TO SEE EFFECT</div>
        {['Hero content…', 'More content here…', 'Even more content…'].map((t, i) => (
          <div key={i} style={{ padding: '24px 0', borderBottom: '1px solid rgba(255,255,255,0.05)' }}>{t}</div>
        ))}
      </div>
    </div>
  );
};

/* ══════════════════════════════════════════════
   OPTION F — Split header with user context
══════════════════════════════════════════════ */
const HeaderF = () => {
  const [active, setActive] = React.useState('Supplements');
  return (
    <div style={{ fontFamily: "'DM Sans',sans-serif", width: '100%' }}>
      <div style={{ background: DARK, padding: '0 32px', display: 'flex', alignItems: 'stretch', height: 68 }}>
        {/* Logo block */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, paddingRight: 32, borderRight: '1px solid rgba(255,255,255,0.08)', marginRight: 32 }}>
          <Logo size={36} />
          <div>
            <div style={{ fontSize: 21, fontWeight: 800, color: T, letterSpacing: '-0.01em', lineHeight: 1 }}>RENEW</div>
            <div style={{ fontSize: 9, color: 'rgba(255,255,255,0.3)', letterSpacing: '0.08em' }}>HEALTH SUPPLIES SECUNDA</div>
          </div>
        </div>
        {/* Categories */}
        <div style={{ display: 'flex', alignItems: 'stretch', gap: 0, flex: 1 }}>
          {CATS.map(c => (
            <button key={c} onClick={() => setActive(c)} style={{
              background: active === c ? 'rgba(43,181,200,0.1)' : 'none',
              border: 'none', padding: '0 18px',
              fontSize: 13, fontWeight: 600,
              color: active === c ? T : 'rgba(255,255,255,0.45)',
              borderBottom: active === c ? `3px solid ${T}` : '3px solid transparent',
              cursor: 'pointer', transition: 'all 0.15s', whiteSpace: 'nowrap',
            }}>{c}</button>
          ))}
        </div>
        {/* User + cart */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 16, paddingLeft: 24, borderLeft: '1px solid rgba(255,255,255,0.08)' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={{ width: 32, height: 32, borderRadius: '50%', background: `linear-gradient(135deg,${T},${TD})`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 700, color: '#fff' }}>J</div>
            <div>
              <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.3)', lineHeight: 1 }}>Signed in as</div>
              <div style={{ fontSize: 13, fontWeight: 700, color: '#fff', lineHeight: 1.4 }}>Jane Smith</div>
            </div>
          </div>
          <button style={{ background: T, color: '#fff', border: 'none', borderRadius: 8, padding: '8px 16px', fontSize: 13, fontWeight: 700, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8 }}>
            <span>🛒</span>
            <span style={{ background: 'rgba(255,255,255,0.25)', borderRadius: 10, padding: '1px 7px', fontSize: 11, fontWeight: 800 }}>3</span>
            <span style={{ fontSize: 13 }}>R1,628</span>
          </button>
        </div>
      </div>
    </div>
  );
};

/* ══════════════════════════════════════════════
   CANVAS
══════════════════════════════════════════════ */
const App = () => (
  <DesignCanvas title="Header Explorations — Renew Health Supplies">
    <DCSection id="s1" title="Option A — Announcement banner + category tab row">
      <DCArtboard id="a1" label="Two rows: promo bar + nav + category tabs" width={900} height={116}>
        <HeaderA />
